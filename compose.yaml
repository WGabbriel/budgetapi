services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - application.env
      - database.env
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file:
      - database.env
    volumes:
      - transaction_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  transaction_data:
